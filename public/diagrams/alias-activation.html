<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>When a canonical alias becomes active | Store Docs</title><style>/* Light values come from app/globals.css. Dark paper and ink are Store's code theme. */
:root {
  color-scheme: light;
  --background: oklch(97.02% 0.0044 186.20);
  --surface: oklch(100% 0.0022 186.20);
  --surface-secondary: oklch(95.24% 0.0035 186.20);
  --foreground: oklch(21.03% 0.0044 186.20);
  --muted: oklch(55.17% 0.0088 186.20);
  --border: oklch(90% 0.0044 186.20);
  --accent: oklch(50.88% 0.0838 186.20);
  --link: var(--accent);
  --font-sans: ui-sans-serif, system-ui, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --background: #141A19;
    --surface: #202424;
    --surface-secondary: #202424;
    --foreground: #F9FDFC;
    --muted: #9AA2A1;
    --border: #414B49;
    /* Same Tidal hue/chroma, lifted for contrast on Store's dark surface. */
    --accent: oklch(76% 0.0838 186.20);
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--background); color: var(--foreground); font-family: var(--font-sans); }
main { max-width: 1120px; margin: auto; padding: 32px; }
.eyebrow { color: var(--muted); font: 12px var(--font-mono); letter-spacing: .12em; }
h1 { font-size: 28px; line-height: 1.2; font-weight: 600; }
@media (max-width: 600px) { main { padding: 16px; } }
@media print { :root { --background: white; --surface: white; --surface-secondary: #f0f4f3; --foreground: #141A19; --muted: #414B49; --border: #bac6c3; --accent: oklch(50.88% 0.0838 186.20); } }

/* Diagram Design semantic roles inherit the Store Docs theme. */
.store-designed-diagram {
  --dd-paper: var(--background);
  --dd-paper-2: var(--surface-secondary);
  --dd-ink: var(--foreground);
  --dd-muted: color-mix(in srgb, var(--foreground) 76%, var(--background));
  --dd-rule: var(--border);
  --dd-accent: var(--accent);
  --dd-tint: color-mix(in srgb, var(--accent) 8%, var(--background));
  --dd-link: var(--link, var(--accent));
  margin: 2rem 0;
  min-width: 0;
  max-width: 100%;
  color: var(--dd-ink);
}
.store-designed-diagram-viewport {
  overflow-x: auto;
  overscroll-behavior-x: contain;
  scrollbar-color: var(--muted) var(--background);
}
.store-designed-diagram-viewport:focus-visible { outline: 2px solid var(--focus, var(--accent)); outline-offset: 4px; }
.store-designed-diagram .dd-svg { display: block; width: 100%; min-width: 720px; height: auto; }
.store-designed-diagram .dd-svg :where(text) { fill: var(--dd-ink); font-family: var(--font-sans, ui-sans-serif, system-ui, sans-serif); }
.store-designed-diagram .dd-name { font-size: 16px; font-weight: 600; }
.store-designed-diagram .dd-mono,
.store-designed-diagram .dd-label { font-family: var(--font-mono, ui-monospace, monospace); font-size: 12px; fill: var(--dd-muted); }
.store-designed-diagram .dd-tag { font-family: var(--font-mono, ui-monospace, monospace); font-size: 12px; letter-spacing: .08em; fill: var(--dd-muted); }
.store-designed-diagram .dd-legend { font-size: 12px; fill: var(--dd-muted); }
.store-designed-diagram .dd-paper { fill: var(--dd-paper); stroke: none; }
.store-designed-diagram .dd-node { fill: var(--surface); stroke: var(--dd-ink); stroke-width: 1; }
.store-designed-diagram .dd-focal { fill: var(--dd-tint); stroke: var(--dd-accent); stroke-width: 1.5; }
.store-designed-diagram .dd-state { fill: var(--dd-paper-2); stroke: var(--dd-muted); stroke-width: 1; }
.store-designed-diagram .dd-optional { fill: var(--dd-paper); stroke: var(--dd-muted); stroke-width: 1; stroke-dasharray: 4 4; }
.store-designed-diagram .dd-zone { fill: var(--dd-paper-2); fill-opacity: .5; stroke: var(--dd-rule); stroke-width: 1; }
.store-designed-diagram .dd-rule { fill: none; stroke: var(--dd-rule); stroke-width: 1; }
.store-designed-diagram .dd-lifeline { fill: none; stroke: var(--dd-muted); stroke-width: 1; stroke-dasharray: 4 4; opacity: .5; }
.store-designed-diagram .dd-edge { fill: none; stroke: var(--dd-muted); stroke-width: 1.5; stroke-linejoin: round; }
.store-designed-diagram .dd-edge-accent { stroke: var(--dd-accent); }
.store-designed-diagram .dd-edge-link { stroke: var(--dd-link); }
.store-designed-diagram .dd-arrow-default { fill: var(--dd-muted); }
.store-designed-diagram .dd-arrow-accent { fill: var(--dd-accent); }
.store-designed-diagram .dd-arrow-link { fill: var(--dd-link); }
.store-designed-diagram figcaption { margin-top: .75rem; max-width: 72ch; font-size: .875rem; line-height: 1.6; color: var(--dd-muted); }
.store-designed-diagram figcaption a { margin-inline-start: .5em; }
@media print {
  .store-designed-diagram-viewport { overflow: visible; }
  .store-designed-diagram .dd-svg { min-width: 0; }
  .store-designed-diagram { break-inside: avoid; }
}
</style></head><body><main><header><p class="eyebrow">STORE DOCS / DIAGRAMS</p><h1>When a canonical alias becomes active</h1></header><figure class="store-designed-diagram"><div class="store-designed-diagram-viewport" tabindex="0" role="region" aria-label="When a canonical alias becomes active; scroll horizontally on small screens"><svg xmlns="http://www.w3.org/2000/svg" class="dd-svg" role="img" aria-labelledby="alias-activation-title alias-activation-desc" viewBox="0 0 960 880"><title id="alias-activation-title">When a canonical alias becomes active</title><desc id="alias-activation-desc">MutationStore persists an ACKED receipt and PENDING alias before adopting the echo, finishes declared invalidation effects, then retires the intent and activates the alias before the existing stream changes delegate.</desc><defs><marker id="alias-activation-arrow-default" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" class="dd-arrow-default"/></marker><marker id="alias-activation-arrow-accent" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" class="dd-arrow-accent"/></marker><marker id="alias-activation-arrow-link" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" class="dd-arrow-link"/></marker></defs><rect x="0" y="0" width="960" height="880" rx="0" class="dd-paper"/><path d="M96 104 V776" class="dd-lifeline"/><path d="M336 104 V776" class="dd-lifeline"/><path d="M576 104 V776" class="dd-lifeline"/><path d="M840 104 V776" class="dd-lifeline"/><g data-message="true"><path d="M96 192 H336" class="dd-edge dd-edge-default" marker-end="url(#alias-activation-arrow-default)"/><g data-label="mutate( provisionalKey, createRef, args)"><rect x="144.0" y="120" width="144" height="64" rx="4" class="dd-paper"/><text x="216.0" y="136" class="dd-label" text-anchor="middle">mutate(</text><text x="216.0" y="156" class="dd-label" text-anchor="middle">provisionalKey,</text><text x="216.0" y="176" class="dd-label" text-anchor="middle">createRef, args)</text></g></g><g data-message="true"><path d="M336 256 H576" class="dd-edge dd-edge-default" marker-end="url(#alias-activation-arrow-default)"/><g data-label="push(provisional identity)"><rect x="384.0" y="204" width="144" height="44" rx="4" class="dd-paper"/><text x="456.0" y="220" class="dd-label" text-anchor="middle">push(provisional</text><text x="456.0" y="240" class="dd-label" text-anchor="middle">identity)</text></g></g><g data-message="true"><path d="M576 320 H336" class="dd-edge dd-edge-default" marker-end="url(#alias-activation-arrow-default)" stroke-dasharray="4 4"/><g data-label="PresentAck( canonicalKey)"><rect x="396.0" y="268" width="120" height="44" rx="4" class="dd-paper"/><text x="456.0" y="284" class="dd-label" text-anchor="middle">PresentAck(</text><text x="456.0" y="304" class="dd-label" text-anchor="middle">canonicalKey)</text></g></g><g data-message="true"><path d="M336 408 H840" class="dd-edge dd-edge-default" marker-end="url(#alias-activation-arrow-default)"/><g data-label="transaction: ACKED receipt + PENDING alias"><rect x="640.0" y="336" width="136" height="64" rx="4" class="dd-paper"/><text x="708" y="352" class="dd-label" text-anchor="middle">transaction:</text><text x="708" y="372" class="dd-label" text-anchor="middle">ACKED receipt +</text><text x="708" y="392" class="dd-label" text-anchor="middle">PENDING alias</text></g></g><g data-message="true"><path d="M336 448 H376 Q384 448 384 456 V472 Q384 480 376 480 H336" class="dd-edge dd-edge-default" marker-end="url(#alias-activation-arrow-default)"/><g data-label="adopt authoritative echo"><rect x="392" y="436" width="168" height="44" rx="4" class="dd-paper"/><text x="400" y="452" class="dd-label" text-anchor="start">adopt authoritative</text><text x="400" y="472" class="dd-label" text-anchor="start">echo</text></g></g><g data-message="true"><path d="M336 528 H376 Q384 528 384 536 V552 Q384 560 376 560 H336" class="dd-edge dd-edge-default" marker-end="url(#alias-activation-arrow-default)"/><g data-label="finish declared invalidation effects"><rect x="392" y="516" width="176" height="44" rx="4" class="dd-paper"/><text x="400" y="532" class="dd-label" text-anchor="start">finish declared</text><text x="400" y="552" class="dd-label" text-anchor="start">invalidation effects</text></g></g><g data-message="true"><path d="M336 648 H840" class="dd-edge dd-edge-accent" marker-end="url(#alias-activation-arrow-accent)"/><g data-label="transaction: retire intent + alias ACTIVE"><rect x="640.0" y="576" width="136" height="64" rx="4" class="dd-paper"/><text x="708" y="592" class="dd-label" text-anchor="middle">transaction:</text><text x="708" y="612" class="dd-label" text-anchor="middle">retire intent +</text><text x="708" y="632" class="dd-label" text-anchor="middle">alias ACTIVE</text></g></g><g data-message="true"><path d="M336 744 H96" class="dd-edge dd-edge-default" marker-end="url(#alias-activation-arrow-default)" stroke-dasharray="4 4"/><g data-label="existing stream collection swaps to canonical delegate"><rect x="132.0" y="672" width="168" height="64" rx="4" class="dd-paper"/><text x="216.0" y="688" class="dd-label" text-anchor="middle">existing stream</text><text x="216.0" y="708" class="dd-label" text-anchor="middle">collection swaps to</text><text x="216.0" y="728" class="dd-label" text-anchor="middle">canonical delegate</text></g></g><g data-node="App"><rect x="40.0" y="40" width="112" height="64" rx="8" class="dd-paper"/><rect x="40.0" y="40" width="112" height="64" rx="8" class="dd-node"/><text x="96.0" y="76" class="dd-name" text-anchor="middle">App</text></g><g data-node="MutationStore"><rect x="244.0" y="40" width="184" height="64" rx="8" class="dd-paper"/><rect x="244.0" y="40" width="184" height="64" rx="8" class="dd-node"/><text x="336.0" y="76" class="dd-name" text-anchor="middle">MutationStore</text></g><g data-node="MutationServer"><rect x="484.0" y="40" width="184" height="64" rx="8" class="dd-paper"/><rect x="484.0" y="40" width="184" height="64" rx="8" class="dd-node"/><text x="576.0" y="76" class="dd-name" text-anchor="middle">MutationServer</text></g><g data-node="Durable journal"><rect x="760.0" y="40" width="160" height="64" rx="8" class="dd-paper"/><rect x="760.0" y="40" width="160" height="64" rx="8" class="dd-node"/><text x="840.0" y="76" class="dd-name" text-anchor="middle">Durable journal</text></g><path d="M40 800 H920" class="dd-rule"/><path d="M40 828 H80" class="dd-edge"/><text x="92" y="832" class="dd-legend" text-anchor="start">Call / local work</text><path d="M320 828 H360" class="dd-edge" stroke-dasharray="4 4"/><text x="372" y="832" class="dd-legend" text-anchor="start">Acknowledgement / return</text></svg></div><figcaption>The alias becomes ACTIVE during retirement finalization, after declared invalidation effects finish. The app keeps the same stream collection.</figcaption></figure></main></body></html>
