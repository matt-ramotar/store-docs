<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Backend acceptance or precondition conflict | Store Docs</title><style>/* Light values come from app/globals.css. Dark paper and ink are Store's code theme. */
:root {
  color-scheme: light;
  --background: oklch(97.02% 0.0044 186.20);
  --surface: oklch(100% 0.0022 186.20);
  --surface-secondary: oklch(95.24% 0.0035 186.20);
  --foreground: oklch(21.03% 0.0044 186.20);
  --muted: oklch(55.17% 0.0088 186.20);
  --border: oklch(90% 0.0044 186.20);
  --accent: oklch(50.88% 0.0838 186.20);
  --link: var(--accent);
  --font-sans: ui-sans-serif, system-ui, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --background: #141A19;
    --surface: #202424;
    --surface-secondary: #202424;
    --foreground: #F9FDFC;
    --muted: #9AA2A1;
    --border: #414B49;
    /* Same Tidal hue/chroma, lifted for contrast on Store's dark surface. */
    --accent: oklch(76% 0.0838 186.20);
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--background); color: var(--foreground); font-family: var(--font-sans); }
main { max-width: 1120px; margin: auto; padding: 32px; }
.eyebrow { color: var(--muted); font: 12px var(--font-mono); letter-spacing: .12em; }
h1 { font-size: 28px; line-height: 1.2; font-weight: 600; }
@media (max-width: 600px) { main { padding: 16px; } }
@media print { :root { --background: white; --surface: white; --surface-secondary: #f0f4f3; --foreground: #141A19; --muted: #414B49; --border: #bac6c3; --accent: oklch(50.88% 0.0838 186.20); } }

/* Diagram Design semantic roles inherit the Store Docs theme. */
.store-designed-diagram {
  --dd-paper: var(--background);
  --dd-paper-2: var(--surface-secondary);
  --dd-ink: var(--foreground);
  --dd-muted: color-mix(in srgb, var(--foreground) 76%, var(--background));
  --dd-rule: var(--border);
  --dd-accent: var(--accent);
  --dd-tint: color-mix(in srgb, var(--accent) 8%, var(--background));
  --dd-link: var(--link, var(--accent));
  margin: 2rem 0;
  min-width: 0;
  max-width: 100%;
  color: var(--dd-ink);
}
.store-designed-diagram-viewport {
  overflow-x: auto;
  overscroll-behavior-x: contain;
  scrollbar-color: var(--muted) var(--background);
}
.store-designed-diagram-viewport:focus-visible { outline: 2px solid var(--focus, var(--accent)); outline-offset: 4px; }
.store-designed-diagram .dd-svg { display: block; width: 100%; min-width: 720px; height: auto; }
.store-designed-diagram .dd-svg :where(text) { fill: var(--dd-ink); font-family: var(--font-sans, ui-sans-serif, system-ui, sans-serif); }
.store-designed-diagram .dd-name { font-size: 16px; font-weight: 600; }
.store-designed-diagram .dd-mono,
.store-designed-diagram .dd-label { font-family: var(--font-mono, ui-monospace, monospace); font-size: 12px; fill: var(--dd-muted); }
.store-designed-diagram .dd-tag { font-family: var(--font-mono, ui-monospace, monospace); font-size: 12px; letter-spacing: .08em; fill: var(--dd-muted); }
.store-designed-diagram .dd-legend { font-size: 12px; fill: var(--dd-muted); }
.store-designed-diagram .dd-paper { fill: var(--dd-paper); stroke: none; }
.store-designed-diagram .dd-node { fill: var(--surface); stroke: var(--dd-ink); stroke-width: 1; }
.store-designed-diagram .dd-focal { fill: var(--dd-tint); stroke: var(--dd-accent); stroke-width: 1.5; }
.store-designed-diagram .dd-state { fill: var(--dd-paper-2); stroke: var(--dd-muted); stroke-width: 1; }
.store-designed-diagram .dd-optional { fill: var(--dd-paper); stroke: var(--dd-muted); stroke-width: 1; stroke-dasharray: 4 4; }
.store-designed-diagram .dd-zone { fill: var(--dd-paper-2); fill-opacity: .5; stroke: var(--dd-rule); stroke-width: 1; }
.store-designed-diagram .dd-rule { fill: none; stroke: var(--dd-rule); stroke-width: 1; }
.store-designed-diagram .dd-lifeline { fill: none; stroke: var(--dd-muted); stroke-width: 1; stroke-dasharray: 4 4; opacity: .5; }
.store-designed-diagram .dd-edge { fill: none; stroke: var(--dd-muted); stroke-width: 1.5; stroke-linejoin: round; }
.store-designed-diagram .dd-edge-accent { stroke: var(--dd-accent); }
.store-designed-diagram .dd-edge-link { stroke: var(--dd-link); }
.store-designed-diagram .dd-arrow-default { fill: var(--dd-muted); }
.store-designed-diagram .dd-arrow-accent { fill: var(--dd-accent); }
.store-designed-diagram .dd-arrow-link { fill: var(--dd-link); }
.store-designed-diagram figcaption { margin-top: .75rem; max-width: 72ch; font-size: .875rem; line-height: 1.6; color: var(--dd-muted); }
.store-designed-diagram figcaption a { margin-inline-start: .5em; }
@media print {
  .store-designed-diagram-viewport { overflow: visible; }
  .store-designed-diagram .dd-svg { min-width: 0; }
  .store-designed-diagram { break-inside: avoid; }
}
</style></head><body><main><header><p class="eyebrow">STORE DOCS / DIAGRAMS</p><h1>Backend acceptance or precondition conflict</h1></header><figure class="store-designed-diagram"><div class="store-designed-diagram-viewport" tabindex="0" role="region" aria-label="Backend acceptance or precondition conflict; scroll horizontally on small screens"><svg xmlns="http://www.w3.org/2000/svg" class="dd-svg" role="img" aria-labelledby="server-outcomes-title server-outcomes-desc" viewBox="0 0 960 728"><title id="server-outcomes-title">Backend acceptance or precondition conflict</title><desc id="server-outcomes-desc">MutationServer sends a deterministic request for generation g and idempotency key k, returns a Present or Absent acknowledgement after backend acceptance, or throws a sanctioned StoreResults.conflict after a precondition conflict.</desc><defs><marker id="server-outcomes-arrow-default" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" class="dd-arrow-default"/></marker><marker id="server-outcomes-arrow-accent" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" class="dd-arrow-accent"/></marker><marker id="server-outcomes-arrow-link" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" class="dd-arrow-link"/></marker></defs><rect x="0" y="0" width="960" height="728" rx="0" class="dd-paper"/><rect x="40" y="280" width="880" height="336" rx="4" class="dd-zone"/><path d="M48 456 H912" class="dd-rule" stroke-dasharray="4 4"/><path d="M160 104 V632" class="dd-lifeline"/><path d="M480 104 V632" class="dd-lifeline"/><path d="M800 104 V632" class="dd-lifeline"/><rect x="40" y="280" width="48" height="24" rx="4" class="dd-paper"/><text x="64" y="296" class="dd-tag" text-anchor="middle">ALT</text><g data-label="[backend accepts]"><rect x="56" y="304" width="152" height="24" rx="4" class="dd-paper"/><text x="64" y="320" class="dd-label" text-anchor="start">[backend accepts]</text></g><g data-label="[precondition conflict]"><rect x="56" y="472" width="200" height="24" rx="4" class="dd-paper"/><text x="64" y="488" class="dd-label" text-anchor="start">[precondition conflict]</text></g><g data-message="true"><path d="M160 184 H480" class="dd-edge dd-edge-default" marker-end="url(#server-outcomes-arrow-default)"/><g data-label="push(generation g, idempotencyKey k)"><rect x="240.0" y="132" width="160" height="44" rx="4" class="dd-paper"/><text x="320.0" y="148" class="dd-label" text-anchor="middle">push(generation g,</text><text x="320.0" y="168" class="dd-label" text-anchor="middle">idempotencyKey k)</text></g></g><g data-message="true"><path d="M480 248 H800" class="dd-edge dd-edge-default" marker-end="url(#server-outcomes-arrow-default)"/><g data-label="deterministic request for g and k"><rect x="548.0" y="196" width="184" height="44" rx="4" class="dd-paper"/><text x="640.0" y="212" class="dd-label" text-anchor="middle">deterministic request</text><text x="640.0" y="232" class="dd-label" text-anchor="middle">for g and k</text></g></g><g data-message="true"><path d="M800 360 H480" class="dd-edge dd-edge-default" marker-end="url(#server-outcomes-arrow-default)" stroke-dasharray="4 4"/><g data-label="authoritative result"><rect x="552.0" y="328" width="176" height="24" rx="4" class="dd-paper"/><text x="640.0" y="344" class="dd-label" text-anchor="middle">authoritative result</text></g></g><g data-message="true"><path d="M480 424 H160" class="dd-edge dd-edge-default" marker-end="url(#server-outcomes-arrow-default)" stroke-dasharray="4 4"/><g data-label="Present or Absent acknowledgement"><rect x="244.0" y="372" width="152" height="44" rx="4" class="dd-paper"/><text x="320.0" y="388" class="dd-label" text-anchor="middle">Present or Absent</text><text x="320.0" y="408" class="dd-label" text-anchor="middle">acknowledgement</text></g></g><g data-message="true"><path d="M800 528 H480" class="dd-edge dd-edge-default" marker-end="url(#server-outcomes-arrow-default)" stroke-dasharray="4 4"/><g data-label="conflict response"><rect x="564.0" y="496" width="152" height="24" rx="4" class="dd-paper"/><text x="640.0" y="512" class="dd-label" text-anchor="middle">conflict response</text></g></g><g data-message="true"><path d="M480 592 H168" class="dd-edge" stroke-dasharray="4 4"/><path d="M156 588 L164 596 M156 596 L164 588" class="dd-edge"/><g data-label="sanctioned throw: StoreResults.conflict"><rect x="228.0" y="540" width="184" height="44" rx="4" class="dd-paper"/><text x="320.0" y="556" class="dd-label" text-anchor="middle">sanctioned throw:</text><text x="320.0" y="576" class="dd-label" text-anchor="middle">StoreResults.conflict</text></g></g><g data-node="Mutation engine"><rect x="60.0" y="40" width="200" height="64" rx="8" class="dd-paper"/><rect x="60.0" y="40" width="200" height="64" rx="8" class="dd-node"/><text x="160.0" y="76" class="dd-name" text-anchor="middle">Mutation engine</text></g><g data-node="MutationServer"><rect x="380.0" y="40" width="200" height="64" rx="8" class="dd-paper"/><rect x="380.0" y="40" width="200" height="64" rx="8" class="dd-node"/><text x="480.0" y="76" class="dd-name" text-anchor="middle">MutationServer</text></g><g data-node="Backend"><rect x="720.0" y="40" width="160" height="64" rx="8" class="dd-paper"/><rect x="720.0" y="40" width="160" height="64" rx="8" class="dd-node"/><text x="800.0" y="76" class="dd-name" text-anchor="middle">Backend</text></g><path d="M40 648 H920" class="dd-rule"/><path d="M40 676 H80" class="dd-edge"/><text x="92" y="680" class="dd-legend" text-anchor="start">Call / local work</text><path d="M320 676 H360" class="dd-edge" stroke-dasharray="4 4"/><text x="372" y="680" class="dd-legend" text-anchor="start">Acknowledgement / return</text><path d="M688 672 L696 680 M688 680 L696 672" class="dd-edge"/><text x="708" y="680" class="dd-legend" text-anchor="start">Sanctioned throw</text></svg></div><figcaption>After the backend accepts, receipt durability determines whether a later drain can replay generation g. That continuation is shown in the next diagram.</figcaption></figure></main></body></html>
